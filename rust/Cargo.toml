[workspace]
members = ["macros"]
resolver = "3"

[package]
name = "capnweb-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "An idiomatic Rust implementation of the Cap'n Web RPC protocol"
license = "MIT"
repository = "https://github.com/cloudflare/capnweb"
publish = false

[lib]
name = "capnweb"

[features]
default = ["websocket"]
# the WebSocket transport (tokio-tungstenite)
websocket = ["dep:tokio-tungstenite"]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
capnweb-macros = { path = "macros" }
futures = "0.3"
num-bigint = "0.4"
rustix = { version = "1", features = ["net"] }
serde = "1"
serde_json = { version = "1", features = ["unbounded_depth"] }
serde_stacker = "0.1"
stacker = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["process", "rt-multi-thread"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
